# Local PostgreSQL + PostGIS for the Node/React stack.
#   docker compose up -d db
#   cd backend && cp .env.example .env && npm install && npm run migrate
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: apepara
      POSTGRES_PASSWORD: apepara
      POSTGRES_DB: apepara
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apepara"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
